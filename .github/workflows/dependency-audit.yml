name: Production Dependency Audit

on:
  push:
    branches: [dependency-audit-20261010]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dependency-audit-20261010

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Regenerate lockfiles from patched manifests
        run: |
          (cd backend && npm install --package-lock-only --ignore-scripts)
          (cd frontend && npm install --package-lock-only --ignore-scripts)

      - name: Persist regenerated lockfiles on audit branch
        run: |
          if ! git diff --quiet -- backend/package-lock.json frontend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/package-lock.json frontend/package-lock.json
            git commit -m "chore(deps): regenerate lockfiles [skip ci]"
            git push origin HEAD:dependency-audit-20261010
          fi

      - name: Backend production dependency audit
        working-directory: backend
        run: |
          npm ci
          npm audit --omit=dev --json > ../backend-production-audit.json || true

      - name: Frontend production dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --json > ../frontend-production-audit.json || true

      - name: Print production audit summaries
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['backend-production-audit.json','frontend-production-audit.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(file, JSON.stringify(data.metadata?.vulnerabilities ?? {}, null, 2));
          }
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: |
            backend-production-audit.json
            frontend-production-audit.json
          retention-days: 7
