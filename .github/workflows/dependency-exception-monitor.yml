name: Dependency exception monitor

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-exception-monitor
  cancel-in-progress: true

jobs:
  frontend-audit:
    name: Frontend dependency exception monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Re-evaluate approved production finding
        run: node scripts/audit-production.mjs
      - name: Detect a newly published picomatch release
        run: |
          latest="$(npm view picomatch version)"
          if [ -z "$latest" ]; then
            echo "::error::npm returned no latest picomatch version"
            exit 1
          fi
          if [ "$latest" != "4.0.7" ]; then
            echo "::error::picomatch latest changed from 4.0.7 to $latest; review and remove the exception if patched"
            exit 1
          fi
      - name: Upload production audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-audit-monitor-${{ github.run_id }}
          path: |
            frontend/audit-report.json
            frontend/dependency-tree.json
          if-no-files-found: warn
          retention-days: 14
