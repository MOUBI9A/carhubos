name: Release validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.project }}
      - name: Dependency gate (high and critical, including build dependencies)
        run: node scripts/security/audit.mjs ${{ matrix.project }}
  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: backend
            target: runner
          - context: backend
            target: migration
          - context: frontend
            target: runner
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: carhub-validation:${{ matrix.context }}-${{ matrix.target }}
      - name: Scan built image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: carhub-validation:${{ matrix.context }}-${{ matrix.target }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
