name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tsc + jest + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Needed for Prisma's generated types to exist before tsc/jest run.
      - run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest

      - name: Lint
        run: npx eslint .

  backend-e2e:
    name: Backend e2e (live Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: carhub_ci
          POSTGRES_PASSWORD: carhub_ci
          POSTGRES_DB: carhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carhub_ci -d carhub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://carhub_ci:carhub_ci@localhost:5432/carhub_ci?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-real
      IDENTITY_PEPPER: ci-only-pepper-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Needed for Prisma's generated types to exist before the e2e spec
      # (which imports AppModule/PrismaService) compiles and runs.
      - run: npx prisma generate

      - name: Apply migrations to a fresh DB
        run: npx prisma migrate deploy

      # No seed step: tenant-isolation.e2e-spec.ts registers its own fresh
      # agencies/users via POST /auth/register (unique run-scoped emails) and
      # tears them down in afterAll — it doesn't depend on prisma/seed*.js.
      - name: Live-DB e2e (auth + cross-tenant 404)
        run: npx jest --config test/jest-e2e.json --runInBand

      - name: Diagnostics live-DB integration
        run: DIAGNOSTICS_DB_TEST=1 npx jest --runInBand --runTestsByPath src/diagnostics/diagnostics.integration.spec.ts

  frontend:
    name: Frontend (tsc + vitest + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Lint
        run: npx eslint .

  e2e:
    name: E2E (Playwright, full stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: carhub_ci
          POSTGRES_PASSWORD: carhub_ci
          POSTGRES_DB: carhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carhub_ci -d carhub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://carhub_ci:carhub_ci@localhost:5432/carhub_ci?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-real
      IDENTITY_PEPPER: ci-only-pepper-not-used-anywhere-real
      ALLOWED_ORIGINS: http://localhost:3002
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      # The frontend's Playwright config spawns the backend itself (`npm run
      # start:dev --prefix ../backend`) as one of its two webServers, so the
      # DB just needs to be migrated + seeded here — the servers are started
      # by Playwright, not this job.
      - name: Prisma generate + migrate + seed
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          node prisma/seed.js
          node prisma/seed-roles.js

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
