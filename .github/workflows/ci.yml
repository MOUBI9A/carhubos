name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tsc + jest + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: npx jest
      - name: Lint
        run: npx eslint .
      - name: Production build
        run: npm run build
      - name: Validate recovery scripts
        working-directory: .
        run: |
          bash -n scripts/db-backup.sh
          bash -n scripts/db-restore.sh

  backend-container:
    name: Backend production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Vercel backend container
        run: docker build -f backend/Dockerfile.vercel -t carhubos-backend:ci backend
      - name: Verify image metadata
        run: |
          docker image inspect carhubos-backend:ci >/dev/null
          docker run --rm carhubos-backend:ci node -e "require('@nestjs/core'); require('@prisma/client'); console.log('runtime dependencies ok')"

  backend-e2e:
    name: Backend e2e (live Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: carhub_ci
          POSTGRES_PASSWORD: carhub_ci
          POSTGRES_DB: carhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carhub_ci -d carhub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://carhub_ci:carhub_ci@localhost:5432/carhub_ci?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-real
      IDENTITY_PEPPER: ci-only-pepper-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations to a fresh DB
        run: npx prisma migrate deploy
      - name: Live-DB e2e (auth + cross-tenant 404)
        run: npx jest --config test/jest-e2e.json

  frontend:
    name: Frontend (tsc + vitest + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:5406/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: node scripts/audit-production.mjs
      - name: Upload production audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-audit-evidence
          path: |
            frontend/audit-report.json
            frontend/dependency-tree.json
          if-no-files-found: warn
          retention-days: 14
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Lint
        run: npx eslint .
      - name: Production build
        run: npm run build

  e2e:
    name: E2E (Playwright, full stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: carhub_ci
          POSTGRES_PASSWORD: carhub_ci
          POSTGRES_DB: carhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carhub_ci -d carhub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://carhub_ci:carhub_ci@localhost:5432/carhub_ci?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-real
      IDENTITY_PEPPER: ci-only-pepper-not-used-anywhere-real
      ALLOWED_ORIGINS: http://localhost:3002
      NEXT_PUBLIC_API_URL: http://localhost:5406/api
      # Production defaults remain strict (100 global / 5 auth per minute).
      # This serial suite intentionally performs many requests and role logins
      # from one loopback IP, so only the isolated CI process raises them.
      THROTTLE_LIMIT: 1000
      AUTH_THROTTLE_LIMIT: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Prisma generate + migrate + seed
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          node prisma/seed.js
          node prisma/seed-roles.js
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run e2e suite
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
